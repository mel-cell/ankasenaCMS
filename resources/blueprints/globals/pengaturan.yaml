title: Pengaturan
fields:
  -
    handle: nama_organisasi
    field:
      type: text
      display: 'Nama Organisasi'
      default: 'OSIS MPK'
  -
    handle: sekolah
    field:
      type: text
      display: Sekolah
  -
    handle: tagline
    field:
      type: text
      display: Tagline
      instructions: 'Satu kalimat pendek untuk hero beranda.'
  -
    handle: deskripsi
    field:
      type: textarea
      display: Deskripsi
      character_limit: 240
  -
    handle: logo
    field:
      type: assets
      display: Logo
      container: assets
      max_files: 1
      restrict: true
      allowed: [svg, png, webp]
  -
    handle: favicon
    field:
      type: assets
      display: Favicon
      container: assets
      max_files: 1
      restrict: true
      allowed: [png, ico, svg]
  -
    handle: periode
    field:
      type: text
      display: Periode
      default: '2025/2026'
  -
    handle: visi
    field:
      type: textarea
      display: Visi
  -
    handle: misi
    field:
      type: grid
      display: Misi
      mode: table
      fields:
        -
          handle: poin
          field:
            type: text
            display: Poin
  -
    handle: alamat
    field:
      type: textarea
      display: Alamat
  -
    handle: instagram
    field:
      type: text
      display: Instagram
  -
    handle: tiktok
    field:
      type: text
      display: TikTok
  -
    handle: youtube
    field:
      type: text
      display: YouTube
  -
    handle: email
    field:
      type: text
      display: Email
      input: email
  -
    handle: whatsapp
    field:
      type: text
      display: WhatsApp
      instructions: 'Format internasional tanpa +, mis. 628123456789.'
  -
    handle: voting_open
    field:
      type: toggle
      display: 'Voting Dibuka'
      instructions: 'Aktifkan saat pemilihan berlangsung.'
  -
    handle: twibon_aktif
    field:
      type: toggle
      display: 'Twibon Aktif'
  -
    handle: pesan_twibon
    field:
      type: textarea
      display: 'Pesan Twibon'
      instructions: 'Tampil di halaman twibon saat belum aktif.'
  -
    handle: logo_osis
    field:
      type: assets
      display: 'Logo OSIS'
      container: assets
      max_files: 1
  -
    handle: logo_mpk
    field:
      type: assets
      display: 'Logo MPK'
      container: assets
      max_files: 1
  -
    handle: deskripsi_osis
    field:
      type: textarea
      display: 'Deskripsi OSIS'
      character_limit: 200
  -
    handle: deskripsi_mpk
    field:
      type: textarea
      display: 'Deskripsi MPK'
      character_limit: 200
  -
    handle: statistik
    field:
      type: grid
      display: Statistik
      mode: table
      add_row: 'Tambah statistik'
      fields:
        -
          handle: angka
          field:
            type: text
            display: Angka
            width: 20
        -
          handle: label
          field:
            type: text
            display: Label
            width: 35
        -
          handle: deskripsi
          field:
            type: text
            display: Deskripsi singkat
  -
    handle: nilai
    field:
      type: grid
      display: 'Nilai fokus organisasi'
      mode: table
      add_row: 'Tambah nilai'
      fields:
        -
          handle: judul
          field:
            type: text
            display: Judul
        -
          handle: deskripsi
          field:
            type: text
            display: Deskripsi
  -
    handle: deskripsi_singkat
    field:
      type: textarea
      display: 'Deskripsi singkat (panel periode)'
      character_limit: 160
  -
    handle: foto_hero
    field:
      type: assets
      display: 'Foto panel periode'
      container: assets
      max_files: 1
      restrict: true
      allowed: [jpg, jpeg, png, webp, avif]
  -
    handle: warna_aksen
    field:
      type: text
      display: 'Warna aksen utama (hex)'
      instructions: 'Mulai dengan #. Emas untuk tombol/chip/CTA. Contoh: #FCBF49'
  -
    handle: warna_aksen_2
    field:
      type: text
      display: 'Warna aksen 2 (hex)'
      instructions: 'Oranye, untuk hover/dekorasi. Contoh: #F77F00'
  -
    handle: warna_aksen_3
    field:
      type: text
      display: 'Warna aksen 3 (hex)'
      instructions: 'Merah, aksen kuat/error — pakai hemat. Contoh: #D62828'
  -
    handle: warna_ink
    field:
      type: text
      display: 'Warna teks utama (hex)'
      instructions: 'Warna terang untuk teks di atas latar gelap. Contoh: #F5EFE0'
  -
    handle: warna_bg
    field:
      type: text
      display: 'Warna navy brand (hex)'
      instructions: 'Untuk hero, footer, tombol gelap, dan teks utama di halaman putih. Contoh: #003049'
  -
    handle: cta_judul
    field:
      type: text
      display: 'Judul CTA'
      instructions: 'Bagian ajakan partnership di beranda.'
  -
    handle: cta_deskripsi
    field:
      type: textarea
      display: 'Deskripsi CTA'
      character_limit: 200
