title: Halaman
fields:
  -
    handle: title
    field:
      type: text
      display: Judul
      validate: required
  -
    handle: template
    field:
      type: template
      display: Template
  -
    handle: intro
    field:
      type: textarea
      display: Intro
      instructions: 'Kalimat pembuka di bawah judul halaman.'
  -
    handle: content
    field:
      type: markdown
      display: Konten
      container: assets
  -
    handle: meta_title
    field:
      type: text
      display: 'SEO: Judul'
  -
    handle: meta_description
    field:
      type: textarea
      display: 'SEO: Deskripsi'
      character_limit: 160
