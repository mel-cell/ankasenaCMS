title: Kabinet
fields:
  -
    handle: nama
    field:
      type: text
      display: Nama
      validate: required
  -
    handle: jabatan
    field:
      type: select
      display: Jabatan
      validate: required
      options:
        - Ketua
        - 'Wakil Ketua'
        - 'Sekretaris I'
        - 'Sekretaris II'
        - 'Bendahara I'
        - 'Bendahara II'
        - 'Koordinator Divisi'
        - Anggota
  -
    handle: divisi
    field:
      type: select
      display: Divisi
      clearable: true
      options:
        - Kepemimpinan
        - Sekretariat
        - Keuangan
        - 'Acara & Event'
        - 'Humas & Media'
        - 'Kreatif & Desain'
        - Olahraga
        - Keagamaan
        - 'Sosial & Lingkungan'
  -
    handle: kelas
    field:
      type: text
      display: Kelas
      width: 50
  -
    handle: angkatan
    field:
      type: text
      display: Angkatan
      width: 50
  -
    handle: foto
    field:
      type: assets
      display: Foto
      container: assets
      max_files: 1
      mode: list
      restrict: true
      allowed: [jpg, jpeg, png, webp, avif]
      focal_point: true
  -
    handle: bio
    field:
      type: textarea
      display: Biodata
      character_limit: 300
  -
    handle: instagram
    field:
      type: text
      display: 'Instagram (tanpa @)'
  -
    handle: urutan
    field:
      type: integer
      display: Urutan
      instructions: 'Angka kecil tampil lebih dulu.'
      default: 100
  -
    handle: periode
    field:
      type: text
      display: Periode
      default: '2025/2026'
  -
    handle: aktif
    field:
      type: toggle
      display: Aktif
      default: true
