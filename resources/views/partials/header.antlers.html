<header class="border-b border-line">
    <div class="wrap flex items-center justify-between gap-6 py-5">
        <a href="/" class="flex items-center gap-3">
            {{ if pengaturan:logo }}
                {{ pengaturan:logo }}
                    <img src="{{ url }}" alt="{{ alt ?? pengaturan:nama_organisasi }}" class="h-9 w-auto">
                {{ /pengaturan:logo }}
            {{ else }}
                <span class="font-display text-xl font-semibold tracking-tight">{{ pengaturan:nama_organisasi }}</span>
            {{ /if }}
        </a>

        <nav aria-label="Navigasi utama" class="hidden items-center gap-7 text-sm font-medium sm:flex">
            {{ collection:pages }}
                <a href="{{ url }}"
                   {{ if current_uri == url }}
                       class="text-ink underline decoration-amber decoration-2 underline-offset-4"
                   {{ elseif segment_1 == slug }}
                       class="text-ink underline decoration-amber decoration-2 underline-offset-4"
                   {{ else }}
                       class="text-ink-soft hover:text-ink"
                   {{ /if }}>
                    {{ title }}
                </a>
            {{ /collection:pages }}
        </nav>

        <a href="/kontak" class="btn btn-secondary hidden text-sm lg:inline-flex">Hubungi</a>

        <button type="button" id="nav-toggle"
                class="rounded-md border border-line p-2 sm:hidden"
                aria-expanded="false" aria-controls="nav-mobile" aria-label="Buka menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M3 6h18M3 12h18M3 18h18"/>
            </svg>
        </button>
    </div>

    <nav id="nav-mobile" hidden aria-label="Navigasi seluler" class="wrap border-t border-line py-3 sm:hidden">
        <ul class="flex flex-col gap-1 text-base">
            {{ collection:pages }}
                <li>
                    <a href="{{ url }}"
                       {{ if current_uri == url }}
                           class="block rounded-md px-2 py-2 font-semibold text-ink"
                       {{ elseif segment_1 == slug }}
                           class="block rounded-md px-2 py-2 font-semibold text-ink"
                       {{ else }}
                           class="block rounded-md px-2 py-2 text-ink-soft hover:bg-paper-2"
                       {{ /if }}>
                        {{ title }}
                    </a>
                </li>
            {{ /collection:pages }}
        </ul>
    </nav>
</header>
