<div>
    <div style="aspect-ratio:4/5;background:var(--card);border-radius:14px;overflow:hidden">
        {{ if foto }}
            <img src="{{ glide:foto width="600" height="750" fit="crop" }}"
                 alt="Foto {{ nama }}"
                 loading="lazy"
                 style="width:100%;height:100%;object-fit:cover">
        {{ /if }}
    </div>
    <p style="margin-top:10px;font-size:14px;font-weight:600">{{ nama }}</p>
    <p style="margin-top:2px;font-size:12px;color:var(--mut)">{{ jabatan }}{{ if kelas }} · {{ kelas }}{{ /if }}</p>
</div>
