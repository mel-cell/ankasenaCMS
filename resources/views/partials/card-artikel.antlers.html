<a href="{{ url }}" class="post">
    <div class="im"{{ if cover }} style="--photo:url('{{ cover }}{{ url }}{{ /cover }}')"{{ /if }}>{{ if kategori }}<i>{{ kategori }}{{ title }}{{ /kategori }}</i>{{ /if }}</div>
    <small>{{ date format="j/n/Y" }}</small>
    <h3>{{ title }}</h3>
    {{ if excerpt }}<p>{{ excerpt }}</p>{{ /if }}
</a>
