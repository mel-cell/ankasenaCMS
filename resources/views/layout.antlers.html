<!doctype html>
<html lang="id" style="--lime: {{ pengaturan:warna_aksen ?? '#FCBF49' }}; --lime2: {{ pengaturan:warna_aksen_2 ?? '#F77F00' }}; --red: {{ pengaturan:warna_aksen_3 ?? '#D62828' }}; --fg: {{ pengaturan:warna_ink ?? '#F5EFE0' }}; --bg: {{ pengaturan:warna_bg ?? '#003049' }};{{ if pengaturan:foto_hero }} --photo: url('{{ pengaturan:foto_hero }}{{ url }}{{ /pengaturan:foto_hero }}');{{ /if }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ if meta_title }}{{ meta_title }}{{ elseif title }}{{ title }}{{ else }}{{ site:name }}{{ /if }} — {{ pengaturan:nama_organisasi }}</title>
    <meta name="description" content="{{ meta_description ?? excerpt ?? pengaturan:deskripsi }}">

    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ if meta_title }}{{ meta_title }}{{ else }}{{ title ?? site:name }}{{ /if }}">
    <meta property="og:description" content="{{ meta_description ?? excerpt ?? pengaturan:deskripsi }}">
    {{ if cover }}
        {{ cover }}<meta property="og:image" content="{{ glide:url width="1200" height="630" fit="crop" absolute="true" }}">{{ /cover }}
    {{ /if }}

    {{ if pengaturan:favicon }}
        {{ pengaturan:favicon }}<link rel="icon" href="{{ url }}">{{ /pengaturan:favicon }}
    {{ /if }}

    {{ vite src="resources/js/site.js|resources/css/site.css|resources/css/landing.css" }}
</head>
<body class="min-h-dvh flex flex-col">
    {{ partial:header }}

    <main id="konten" class="flex-1">
        {{ template_content }}
    </main>

    {{ partial:footer }}
</body>
</html>
